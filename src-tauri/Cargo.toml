[package]
name = "webapps"
version = "0.1.0"
description = "A desktop app that turns web applications into standalone experiences"
authors = ["you"]
edition = "2021"

[lib]
name = "webapps_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
