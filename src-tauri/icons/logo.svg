<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Browser window frame - outline only, no fill -->
  <rect x="100" y="116" width="312" height="280" rx="28" fill="none" stroke="white" stroke-width="10"/>

  <!-- Title bar background -->
  <rect x="105" y="121" width="302" height="52" rx="23" fill="white" opacity="0.2"/>

  <!-- Title bar separator -->
  <line x1="100" y1="173" x2="412" y2="173" stroke="white" stroke-width="10"/>

  <!-- Window control dots -->
  <circle cx="136" cy="146" r="10" fill="white"/>
  <circle cx="168" cy="146" r="10" fill="#C4B5FD"/>
  <circle cx="200" cy="146" r="10" fill="#A78BFA"/>

  <!-- Globe circle -->
  <circle cx="256" cy="292" r="72" fill="none" stroke="white" stroke-width="9"/>

  <!-- Vertical meridian -->
  <ellipse cx="256" cy="292" rx="36" ry="72" fill="none" stroke="white" stroke-width="6" opacity="0.6"/>

  <!-- Horizontal equator -->
  <line x1="184" y1="292" x2="328" y2="292" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Upper latitude arc -->
  <path d="M 196 258 Q 256 242 316 258" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Lower latitude arc -->
  <path d="M 196 326 Q 256 342 316 326" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.4"/>
</svg>
